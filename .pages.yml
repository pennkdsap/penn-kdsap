                required: true
              - name: introduction
                label: Introduction
                type: text
                required: true
              - name: mapLabel
                label: Map accessible label
                type: string
                required: true
              - name: fallbackText
                label: Map fallback text
                type: text
                required: true
              - name: listLabel
                label: Site-list accessible label
                type: string
                required: true
              - name: pinLabel
                label: Pin accessible action
                type: string
                required: true
              - name: sourceLabel
                label: Section link text
