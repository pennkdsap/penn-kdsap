            type: string
            required: true
          - name: emptyText
            label: Empty-calendar text
            type: text
            required: true
          - name: memberTitle
            label: Member calendar heading
            type: string
            required: true
          - name: memberText
            label: Member calendar text
            type: text
            required: true
          - name: contactActionLabel
            label: Contact link text
            type: string
            required: true
          - name: contactActionUrl
            label: Contact link URL
            type: string
            required: true
