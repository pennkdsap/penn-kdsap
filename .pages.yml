            label: Hero small heading
            type: string
            required: true
          - name: title
            label: Hero heading
            type: string
            required: true
          - name: summary
            label: Hero supporting text
            type: text
            required: true
          - name: heroImage
            label: Hero image
            type: image
            required: true
          - name: heroImageAlt
            label: Hero image description
            type: string
            required: true
          - name: publicCalendarUrl
            label: Public Google Calendar URL
            type: string
            description: Paste the public calendar link here. Leave blank if the calendar is not public yet.
          - name: calendarActionLabel
            label: Calendar button text
            type: string
            required: true
          - name: upcomingEvents
            label: Upcoming public events
            type: object
            description: These cards appear on the Events page; the first three also appear in the homepage quick calendar.
            list:
              collapsible:
                collapsed: true
                summary: "{month} {day} — {title}"
            fields:
              - name: month
                label: Month abbreviation
                type: string
                required: true
              - name: day
                label: Day
                type: string
                required: true
              - name: type
                label: Event type
                type: string
                required: true
              - name: title
                label: Event title
                type: string
                required: true
              - name: location
                label: Location
                type: string
                required: true
              - name: actionLabel
                label: Event link text
                type: string
              - name: actionUrl
