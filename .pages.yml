media:
  input: public/images
  output: /images

settings:
  commit:
    # Show the editor's identity in the commit when Pages CMS has it.
    identity: user
    templates:
      update: "content: update {name}"

content:
  - name: pages
    label: Website pages
    type: group
    items:
      - name: homepage
        label: Homepage
        type: file
        path: content/home.json
        format: json
        operations:
          delete: false
        fields:
          - name: pageTitle
            label: Browser and share title
            type: string
            required: true
          - name: metaDescription
            label: Search description
            type: text
            required: true
          - name: siteName
            label: Site name
            type: string
            required: true
          - name: skipLinkText
            label: Skip link text
            type: string
            required: true
          - name: brandAlt
            label: Logo accessible label
            type: string
            required: true
          - name: primaryNavigationLabel
            label: Navigation accessible label
            type: string
            required: true
          - name: menuLabel
            label: Mobile menu label
            type: string
            required: true
          - name: navigation
            label: Main navigation
            type: object
            list: true
            required: true
            fields:
              - name: label
                label: Link text
                type: string
                required: true
              - name: url
                label: Link path
                type: string
                required: true
          - name: headerAction
            label: Header action
            type: object
            fields:
              - name: label
                label: Button text
                type: string
                required: true
              - name: url
                label: Link path
                type: string
                required: true
          - name: redirectPage
            label: Redirect page
            type: object
            fields:
