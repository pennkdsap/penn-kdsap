            type: image
            required: true
          - name: heroImageAlt
            label: Hero image description
            type: string
            required: true
          - name: boardEyebrow
            label: Board small heading
            type: string
            required: true
          - name: boardTitle
            label: Board heading
            type: string
            required: true
          - name: boardIntroduction
            label: Board introduction
            type: text
            required: true
          - name: people
            label: Leadership members
            type: object
            description: Use Add item to create a member, drag cards to reorder them, or turn off Show on website to keep a member saved but unpublished.
            list:
              collapsible:
                collapsed: true
                summary: "{name} — {role}"
            fields:
              - name: name
                label: Full name
                type: string
                required: true
              - name: role
                label: Leadership title
                type: string
                required: true
              - name: group
                label: Group label
                type: string
                description: For example, Student Board.
                required: true
              - name: image
                label: Portrait photo
                type: image
                required: true
              - name: imageAlt
                label: Portrait description
                type: string
                description: Use a short description such as Portrait of Jane Smith.
                required: true
              - name: active
                label: Show on website
                type: boolean
                default: true
      - name: events
        label: Events and calendar
        type: file
        path: content/pages/events.json
        format: json
