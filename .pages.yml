                label: Browser title
                type: string
                required: true
              - name: message
                label: Message
                type: string
                required: true
              - name: actionLabel
                label: Link text
                type: string
                required: true
          - name: hero
            label: Hero
            type: object
            fields:
              - name: eyebrow
                label: Small heading
                type: string
                required: true
              - name: title
                label: Main heading
                type: string
                required: true
              - name: summary
                label: Supporting text
                type: text
                required: true
              - name: image
                label: Background image
                type: image
                required: true
              - name: imageAlt
                label: Background image description
                type: string
                required: true
              - name: actionsLabel
                label: Actions accessible label
                type: string
                required: true
              - name: primaryAction
                label: Primary action
