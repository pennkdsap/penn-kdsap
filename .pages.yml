                required: true
              - name: text
                label: Supporting text
                type: text
                required: true
              - name: actionLabel
                label: Button text
                type: string
                required: true
              - name: actionUrl
                label: Link path
                type: string
                required: true
          - name: footer
            label: Footer
            type: object
            fields:
