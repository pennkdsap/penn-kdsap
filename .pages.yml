            fields:
              - name: eyebrow
                label: Small heading
                type: string
                required: true
              - name: title
                label: Heading
                type: string
                required: true
              - name: introduction
                label: Reporting-period note
                type: text
                required: true
              - name: sourceLabel
                label: Source link text
