              - name: image
                label: Photo
                type: image
                required: true
              - name: imageAlt
                label: Photo description
                type: string
                required: true
              - name: imageCaption
                label: Photo caption
                type: string
                required: true
              - name: actionLabel
                label: Link text
                type: string
                required: true
              - name: actionUrl
                label: Link path
                type: string
                required: true
          - name: stories
            label: Field stories section
            type: object
            fields:
              - name: eyebrow
                label: Small heading
                type: string
                required: true
              - name: title
                label: Heading
                type: string
                required: true
              - name: actionLabel
                label: Section link text
                type: string
                required: true
              - name: actionUrl
                label: Section link path
                type: string
                required: true
              - name: items
                label: Story photos
                type: object
                list: true
                required: true
