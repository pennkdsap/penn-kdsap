<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gallery | Penn KDSAP</title>
    <meta name="description" content="Photos from Penn KDSAP health screenings, education, and community events.">
    <meta property="og:image" content="https://pennkdsap.github.io/penn-kdsap/images/penn-kdsap-og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://pennkdsap.github.io/penn-kdsap/images/penn-kdsap-og.png">
    <link rel="icon" href="../favicon.png" type="image/png">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #151515; font-family: Arial, Helvetica, sans-serif; background: #fff; }
      header { min-height: 92px; display: flex; align-items: center; justify-content: space-between; gap: 28px; max-width: 1240px; margin: 0 auto; padding: 20px 32px; border-bottom: 1px solid #d9d9d9; }
      .brand { color: #8b1e3f; font-family: Georgia, serif; font-size: 1.7rem; font-weight: 700; text-decoration: none; white-space: nowrap; }
      nav { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 20px; }
      nav a { color: #222; font-size: .93rem; text-decoration: none; }
      nav a:hover, nav a[aria-current='page'] { color: #8b1e3f; text-decoration: underline; text-underline-offset: 5px; }
      main { max-width: 1240px; margin: 0 auto; padding: 58px 32px 76px; }
      h1 { margin: 0; color: #8b1e3f; font-family: Georgia, serif; font-size: clamp(2.3rem, 5vw, 4rem); }
      main > p { margin: 12px 0 38px; font-size: 1.08rem; line-height: 1.5; }
      .gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
      .gallery a { aspect-ratio: 1; overflow: hidden; background: #f2f2f2; }
      .gallery img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .2s ease; }
      .gallery a:hover img, .gallery a:focus-visible img { transform: scale(1.04); }
      .gallery a:focus-visible { outline: 3px solid #8b1e3f; outline-offset: 3px; }
      @media (max-width: 720px) { header { align-items: flex-start; flex-direction: column; padding: 20px 22px; } nav { justify-content: flex-start; gap: 12px 17px; } main { padding: 40px 22px 56px; } .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; } }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="../">Penn KDSAP</a>
      <nav aria-label="Primary navigation">
        <a href="../about/">About</a>
        <a href="../what-we-do/">What We Do</a>
        <a href="../meet-the-team/">Meet the Team</a>
        <a aria-current="page" href="./">Gallery</a>
        <a href="../contact-us/">Contact</a>
      </nav>
    </header>
    <main>
      <h1>{{GALLERY_TITLE}}</h1>
      <p>{{GALLERY_INTRODUCTION}}</p>
      <section class="gallery" aria-label="Penn KDSAP photo gallery">
        {{GALLERY_IMAGES}}
      </section>
    </main>
  </body>
</html>
